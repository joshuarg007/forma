[project]
name = "forma-runtime"
version = "0.1.0"
description = "Open-source backend runtime for React apps. Define your schema, get REST + GraphQL + Auth instantly."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Axion Deep Labs", email = "hello@axiondeep.com"}
]
requires-python = ">=3.11"
keywords = ["api", "backend", "fastapi", "graphql", "rest", "schema", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.1",

    # Validation
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",  # Pinned for passlib compatibility
    "python-multipart>=0.0.6",

    # GraphQL
    "strawberry-graphql[fastapi]>=0.217.1",

    # Storage
    "boto3>=1.34.0",
    "aiofiles>=23.2.1",

    # CLI
    "typer[all]>=0.9.0",
    "rich>=13.7.0",

    # Utils
    "httpx>=0.26.0",
    "orjson>=3.9.10",
    "structlog>=24.1.0",

    # Observability
    "prometheus-client>=0.19.0",

    # Dev server
    "watchdog>=3.0.0",

    # AI schema generation
    "ollama>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
forma-runtime = "forma_runtime.cli:app"

[project.urls]
Homepage = "https://axiondeep.com/forma"
Documentation = "https://docs.axiondeep.com/forma"
Repository = "https://github.com/axiondeeplabs/forma"
Issues = "https://github.com/axiondeeplabs/forma/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forma_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
